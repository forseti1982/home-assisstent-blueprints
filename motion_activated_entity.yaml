blueprint:
  name: LIGHTS -Automation based on LUX and TIME
  description: "Turn on a light, switch, scene, script or group based on motion detection,\
    \ and low light level.\n\
    \nRequired entities:\n  - Motion sensor (single sensor or group)\n  - Target entity\
    \ (light, switch, scene or script)\n\n\nOptional features:\n- You can set a cutoff\
    \ entity of which the value determines whether the illuminance level is low and\
    \ the automation needs to trigger. \n- You can define a blocking entity, which blocks\
    \ the automation from running when this entity's state is on. \n- You van define\
    \ a turn-off blocking entity, which blocks the entity from turning off after the\
    \ set delay. \n- Time limits can also be defined to limit the time before and after\
    \ the automation should trigger. \n- If you want the entity to turn off after a\
    \ certain amount of seconds, you can use the Wait Time input. \n- If you want another\
    \ entity than the target_entity to turn off after the delay, you can define a\
    \ separate Turn-off entity. \n- If you do not enable the optional entities the automation\
    \ will skip these conditions.\n\
    \nTurn-off is driven by a dedicated 'no motion for X seconds' trigger instead of\
    \ a script-internal wait, so a flickering sensor or a Home Assistant restart can\
    \ no longer leave the target entity stuck on."
  domain: automation
  input:
    motion_sensor:
      name: Motion Sensor
      description: This sensor will trigger the turning on of the target entity.
      selector:
        entity:
          domain: binary_sensor
    target_entity:
      name: Target entity.
      description: The light, switch, scene to turn on (or script to run) when the
        automation is triggered.
      selector:
        entity: {}
    no_motion_wait:
      name: Turn off wait time (seconds)
      description: Time in seconds to leave the target entity on after last motion
        is detected. The sensor must stay off for this whole time - a short false
        re-trigger restarts the countdown instead of re-running the automation.
      default: 0
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: seconds
    illuminance_sensor:
      name: (OPTIONAL) Illuminance sensor
      description: This sensor will be used to determine the illumination.
      default:
      selector:
        entity:
          domain: sensor
          device_class: illuminance
    illuminance_cutoff:
      name: (OPTIONAL) Illuminance cutoff value
      description: This input_number will be used to compare to the current illumination
        to determine if it is low. If a cutoff is set but the sensor reports no usable
        value, the automation does NOT turn on (it no longer treats an unavailable
        sensor as 0 lx / pitch dark).
      default:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: lx
    blocker_entity:
      name: (OPTIONAL) Blocking entity
      description: If this entity's state is on, it will prevent the automation from
        running. E.g. sleepmode or away mode.
      default:
      selector:
        entity: {}
    time_limit_after:
      name: (OPTIONAL) Only run after time.
      description: Automation will only run when time is later than this input_datetime
        value. Only limits turning ON - turning off is never blocked by the time
        window.
      default:
      selector:
        entity:
          domain: input_datetime
    time_limit_before:
      name: (OPTIONAL) Only run before time.
      description: Automation will only run when time is earlier than this input_datetime
        value. Only limits turning ON - turning off is never blocked by the time
        window.
      default:
      selector:
        entity:
          domain: input_datetime
    turn_off_blocker_entity:
      name: (OPTIONAL) Turn-off Blocking entity
      description: If this entity's state is on, it will prevent the target entity
        from turning off after the set delay.
      default:
      selector:
        entity: {}
    target_off_entity:
      name: (OPTIONAL) Turn-off entity
      description: If defined, this entity will be turned off instead of the default
        target entity. This can be helpful when using target entities of type scene
        or script. 
        You cannot use Turn-off entity and Turn-off action, only one or the other. If both are defined, Turn-off entity will be used.
      default:
      selector:
        entity: {}
    target_off_action:
      name: (OPTIONAL) Turn-off action
      description: If defined, this action will be run instead of the turning off the default target entity. This can be helpful when using taget entities of type scene or script. 
        You cannot use Turn-off entity and Turn-off action, only one or the other. If both are defined, Turn-off entity will be used.
      default:
      selector:
        action: {}
  source_url: https://github.com/forseti1982/home-assisstent-blueprints/blob/main/motion_activated_entity.yaml

# Both branches only ever run a single, instant service call, so a queue is enough
# and no run can be killed halfway through any more.
mode: queued
max: 10

variables:
  target_entity: !input 'target_entity'
  illuminance_currently: !input 'illuminance_sensor'
  illuminance_cutoff: !input 'illuminance_cutoff'
  blocker_entity: !input 'blocker_entity'
  time_limit_before: !input 'time_limit_before'
  time_limit_after: !input 'time_limit_after'
  no_motion_wait: !input 'no_motion_wait'
  turn_off_blocker_entity: !input 'turn_off_blocker_entity'
  target_off_entity: !input 'target_off_entity'
  target_off_action: !input 'target_off_action'

trigger:
# 'from: off' is required: without it every unavailable -> on hop (reboot, zigbee
# reconnect, flat battery) counts as motion.
- id: motion_on
  platform: state
  entity_id: !input 'motion_sensor'
  from: 'off'
  to: 'on'
# The whole turn-off timing lives in 'for:'. A short false re-detect resets the
# timer rather than restarting the automation, and the timer survives a restart.
- id: motion_off
  platform: state
  entity_id: !input 'motion_sensor'
  from: 'on'
  to: 'off'
  for:
    hours: 0
    minutes: 0
    seconds: !input 'no_motion_wait'

action:
- choose:

  # ------------------------------ TURN ON ------------------------------
  - conditions:
    - condition: trigger
      id: motion_on
    # Illuminance. states() instead of states[] so a missing entity cannot raise,
    # and is_number so 'unavailable' is not silently read as 0 lx.
    - condition: template
      value_template: '{% set lux = states(illuminance_currently) if illuminance_currently
        != none else none %} {{ (illuminance_currently == none) or (illuminance_cutoff
        == none) or ((lux is not none) and (lux | is_number) and (lux | float < illuminance_cutoff
        | float)) }}'
    - condition: template
      value_template: '{{ (blocker_entity == none) or (states(blocker_entity) != ''on'')
        }}'
    - condition: template
      value_template: '{% set current_time = now().strftime("%H:%M")  %}

        {% if time_limit_before != none and time_limit_after == none %} {{ states(time_limit_before)
        > current_time }} {% elif time_limit_before == none and time_limit_after !=
        none %} {{ states(time_limit_after) < current_time }} {% elif time_limit_before
        != none and time_limit_after != none %} {% set before_limit_is_on_next_day
        = states(time_limit_after) > states(time_limit_before)  %} {% if not before_limit_is_on_next_day
        %} {{ (states(time_limit_after) < current_time) and (states(time_limit_before)
        > current_time) }} {% elif before_limit_is_on_next_day %} {{ (states(time_limit_before)
        > current_time) or (states(time_limit_after) < current_time) }} {% endif %}
        {% else %} true {% endif %}

        '
    sequence:
    - service: homeassistant.turn_on
      entity_id: !input 'target_entity'

  # ------------------------------ TURN OFF -----------------------------
  - conditions:
    - condition: trigger
      id: motion_off
    - condition: template
      value_template: '{{ (turn_off_blocker_entity == none) or (states(turn_off_blocker_entity)
        != ''on'') }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ (target_off_entity != none) }}'
        sequence:
        - service: homeassistant.turn_off
          entity_id: !input 'target_off_entity'
      - conditions:
        - condition: template
          value_template: '{{ (target_off_action != none) }}'
        sequence: !input 'target_off_action'
      default:
      - service: homeassistant.turn_off
        entity_id: !input 'target_entity'
