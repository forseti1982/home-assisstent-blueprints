blueprint:
  name: LIGHTS - Motion activated Light with LUX and Time relation
  description: Turn on a light when motion is detected within a certain time contraint, related to the lux strengh as an ECO mode.
  domain: automation
  input:
    motion_entity:
      name: Motion Sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light
    light_brightness:
      name: Light brightness
      description: Light brightness level for configured lamps on trigger.
      default: 50
      selector:
        number:
          min: 0
          max: 200
    time_from:
      name: 'Timeslot from'
      default: "22:00:00"
      selector:
        time:
    time_to:
      name: 'Timeslot to'
      default: "07:00:00"
      selector:
        time:
    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected. The
        sensor must stay off for this whole time - a short false re-detect resets
        the countdown.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    illuminance_sensor:
      name: (OPTIONAL) Illuminance sensor
      description: This sensor will be used to determine the illumination.
      default:
      selector:
        entity:
          domain: sensor
          device_class: illuminance
    illuminance_cutoff:
      name: (OPTIONAL) Illuminance cutoff value
      description: This input_number will be used to compare to the current illumination
        to determine if it is low. If a cutoff is set but the sensor reports no usable
        value, the light stays off.
      default:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: lx
  source_url: https://github.com/forseti1982/home-assisstent-blueprints/blob/main/LIGHTS%20-%20Timed-lux%20based%20auto%20trigger%20with%20motion%20detection.yaml

# Only instant service calls in both branches, so nothing can be killed mid-run.
mode: queued
max: 10

variables:
  illuminance_currently: !input illuminance_sensor
  illuminance_cutoff: !input illuminance_cutoff

trigger:
- id: motion_on
  platform: state
  entity_id: !input motion_entity
  from: "off"
  to: "on"
# Turn-off timing lives in 'for:' so it survives a restart and is immune to a
# flickering sensor.
- id: motion_off
  platform: state
  entity_id: !input motion_entity
  from: "on"
  to: "off"
  for:
    hours: 0
    minutes: 0
    seconds: !input no_motion_wait

action:
- choose:
  - conditions:
    - condition: trigger
      id: motion_on
    - condition: time
      after: !input time_from
      before: !input time_to
    # Was 'condition: numeric_state' with after/before keys, which is not valid
    # config - it stopped the whole blueprint from loading. The cutoff input was
    # never evaluated at all.
    - condition: template
      value_template: '{% set lux = states(illuminance_currently) if illuminance_currently
        != none else none %} {{ (illuminance_currently == none) or (illuminance_cutoff
        == none) or ((lux is not none) and (lux | is_number) and (lux | float < illuminance_cutoff
        | float)) }}'
    sequence:
    - service: light.turn_on
      target: !input light_target
      data:
        brightness_pct: !input light_brightness
  - conditions:
    - condition: trigger
      id: motion_off
    sequence:
    - service: light.turn_off
      target: !input light_target
